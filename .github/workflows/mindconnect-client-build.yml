# Builds the preconfigured MindConnect client for every CI platform.
# Pull requests and manual runs upload Actions artifacts and do not publish a release.
# GitHub Releases stay on betterdesk-desktop-release.yml (push to master / desktop tags).
name: MindConnect client builds

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: mindconnect-client-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: build-${{ github.run_id }}
    secrets: inherit
