# Pull requests build the Android arm64 APK first.
# workflow_dispatch scope:
#   android-arm64 — one sideloadable APK
#   rest — Windows, Linux, and macOS (no iOS)
#   all — every job, including the unsigned iOS IPA
name: MindConnect client builds

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "android-arm64, rest, or all"
        required: true
        default: android-arm64
        type: choice
        options:
          - android-arm64
          - rest
          - all
  pull_request:

concurrency:
  group: mindconnect-${{ github.ref }}-${{ github.event.inputs.scope || 'android-arm64' }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: build-${{ github.run_id }}
      scope: ${{ github.event.inputs.scope || 'android-arm64' }}
    secrets: inherit
