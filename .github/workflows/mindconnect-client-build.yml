# Pull requests build the unattended Windows x64 installer and Android host APK.
# workflow_dispatch scope:
#   unattended — Windows x64 MSI/EXE and the Android host APK
#   android-arm64 — Android arm64 APK only
#   rest — Windows, Linux, and macOS (no iOS)
#   all — every job, including the unsigned iOS IPA
name: MindConnect client builds

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "unattended, android-arm64, rest, or all"
        required: true
        default: unattended
        type: choice
        options:
          - unattended
          - android-arm64
          - rest
          - all
  pull_request:

concurrency:
  group: mindconnect-${{ github.ref }}-${{ github.event.inputs.scope || 'unattended' }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: build-${{ github.run_id }}
      scope: ${{ github.event.inputs.scope || 'unattended' }}
    secrets: inherit
